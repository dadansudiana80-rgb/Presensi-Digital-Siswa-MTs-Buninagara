<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Presensi Online MTs Buninagara</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- JsBarcode for Barcode Generation -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <!-- HTML5 QRCode Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- SheetJS for Excel Upload & Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- jsPDF & AutoTable for Report Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- Login Screen -->
    <div id="loginSection" class="fixed inset-0 z-40 bg-gradient-to-br from-emerald-800 via-emerald-700 to-teal-900 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transition-all transform duration-300">
            <div class="p-8 text-center bg-emerald-50/50 border-b border-emerald-100">
                <div class="w-24 h-24 mx-auto mb-3 rounded-full bg-white shadow-md p-2 flex items-center justify-center border-2 border-emerald-500">
                    <img id="loginLogo" src="https://placehold.co/120x120/16a34a/ffffff?text=MTS+BUNINAGARA" alt="Logo MTs Buninagara" class="w-full h-full object-contain rounded-full">
                </div>
                <h1 class="text-xl font-bold text-slate-800">MTs BUNINAGARA</h1>
                <p class="text-xs text-emerald-700 font-medium mt-1">Sistem Presensi Online Siswa</p>
            </div>

            <div class="p-6 sm:p-8">
                <!-- Role Toggle Tabs -->
                <div class="flex p-1 bg-slate-100 rounded-xl mb-6">
                    <button id="tabBtnAdmin" onclick="switchLoginTab('admin')" class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all bg-emerald-600 text-white shadow-sm">
                        <i class="fa-solid fa-user-shield mr-1"></i> Admin
                    </button>
                    <button id="tabBtnGuru" onclick="switchLoginTab('guru')" class="flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all">
                        <i class="fa-solid fa-chalkboard-user mr-1"></i> Guru Mapel
                    </button>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Username / NIP</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="text" id="loginUsername" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all" placeholder="Masukkan username">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="password" id="loginPassword" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:bg-white transition-all" placeholder="Masukkan password">
                        </div>
                    </div>

                    <div id="loginHint" class="p-3 bg-emerald-50 rounded-lg text-xs text-emerald-800 border border-emerald-200">
                        <span class="font-bold">Info Demo Admin:</span><br>
                        User: <code class="bg-white px-1.5 py-0.5 rounded border border-emerald-300 font-mono">MTsbuninagara</code><br>
                        Pass: <code class="bg-white px-1.5 py-0.5 rounded border border-emerald-300 font-mono">Dadan.123</code>
                    </div>

                    <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                        <span>Masuk ke Sistem</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App Container (Hidden before login) -->
    <div id="appContainer" class="hidden flex-1 flex flex-col md:flex-row min-h-screen">
        
        <!-- Sidebar Navigation (Desktop) -->
        <aside class="hidden md:flex flex-col w-64 bg-slate-900 text-white border-r border-slate-800 shrink-0">
            <div class="p-5 border-b border-slate-800 flex items-center gap-3">
                <img id="appLogoSidebar" src="https://placehold.co/120x120/16a34a/ffffff?text=MTS" alt="Logo" class="w-10 h-10 rounded-lg object-contain bg-white p-1">
                <div class="overflow-hidden">
                    <h2 class="font-bold text-sm tracking-wide text-white truncate">MTs BUNINAGARA</h2>
                    <p class="text-[10px] text-emerald-400 truncate">Presensi Online Siswa</p>
                </div>
            </div>

            <!-- User Badge -->
            <div class="p-4 mx-3 my-3 bg-slate-800/80 rounded-xl border border-slate-700/50 flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold text-sm shrink-0" id="userAvatar">
                    A
                </div>
                <div class="overflow-hidden">
                    <div id="userDisplayName" class="text-xs font-semibold text-white truncate">Administrator</div>
                    <div id="userDisplayRole" class="text-[10px] text-slate-400 uppercase tracking-wider">Super Admin</div>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-3 py-2 space-y-1 overflow-y-auto hide-scrollbar" id="desktopNavLinks">
                <!-- Nav items generated via JS -->
            </nav>

            <div class="p-4 border-t border-slate-800">
                <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-3 py-2.5 text-xs font-medium text-rose-400 hover:bg-rose-950/40 rounded-xl transition-all">
                    <i class="fa-solid fa-right-from-bracket text-base"></i>
                    <span>Keluar / Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            <!-- Top Bar Mobile -->
            <header class="bg-slate-900 text-white p-4 flex items-center justify-between md:hidden shadow-md">
                <div class="flex items-center gap-3">
                    <img id="appLogoHeader" src="https://placehold.co/120x120/16a34a/ffffff?text=MTS" alt="Logo" class="w-8 h-8 rounded-lg object-contain bg-white p-0.5">
                    <div>
                        <h1 class="font-bold text-sm">MTs BUNINAGARA</h1>
                        <p id="mobileHeaderUser" class="text-[10px] text-emerald-400">Presensi Online</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="p-2 text-rose-400 hover:text-rose-300">
                    <i class="fa-solid fa-right-from-bracket text-lg"></i>
                </button>
            </header>

            <!-- Dynamic Body View Container -->
            <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-50 pb-24 md:pb-8" id="mainContentView">
                <!-- Dynamic view injects here -->
            </main>

            <!-- Bottom Navigation Bar (Mobile Only) -->
            <nav id="mobileBottomNav" class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 px-2 py-1.5 flex justify-around items-center z-30 shadow-lg">
                <!-- Items populated via JS -->
            </nav>

        </div>
    </div>

    <!-- Modal Container for Dynamic Dialogs -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div id="modalCard" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden transform transition-all duration-200">
            <!-- Modal Header -->
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-base">Modal Title</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-200 text-slate-600 hover:bg-slate-300 flex items-center justify-center text-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <!-- Modal Body -->
            <div id="modalBody" class="p-6 overflow-y-auto flex-1">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <script>
        // Default Storage State Initialization
        const APP_TITLE = "MTs BUNINAGARA";
        let currentUser = null; // { role: 'admin'|'guru', username: '', name: '', nip: '', mapel: '' }
        let currentView = 'dashboard';

        // Initial Mock Data
        let appData = {
            logo: "https://placehold.co/120x120/16a34a/ffffff?text=MTS+BUNINAGARA",
            teachers: [
                { id: "G001", name: "Dadan Ramdani, S.Pd.", nip: "198501122010011002", mapel: "Matematika", kelas: "7A, 8A, 9A" },
                { id: "G002", name: "Siti Nurjanah, S.Ag.", nip: "198804152012022001", mapel: "Bahasa Arab", kelas: "7A, 7B, 8A" },
                { id: "G003", name: "Ahmad Fauzi, M.Pd.", nip: "199002202015031004", mapel: "IPA Terpadu", kelas: "8A, 8B, 9B" }
            ],
            accounts: [
                { id: "ACC-G001", teacherId: "G001", username: "dadan", password: "123", teacherName: "Dadan Ramdani, S.Pd.", mapel: "Matematika" },
                { id: "ACC-G002", teacherId: "G002", username: "siti", password: "123", teacherName: "Siti Nurjanah, S.Ag.", mapel: "Bahasa Arab" }
            ],
            students: [
                { nis: "1001", name: "Ahmad Saepullah", class: "7A", gender: "L" },
                { nis: "1002", name: "Anisa Fitriani", class: "7A", gender: "P" },
                { nis: "1003", name: "Budi Santoso", class: "7A", gender: "L" },
                { nis: "1004", name: "Dewi Kurnia", class: "8A", gender: "P" },
                { nis: "1005", name: "Faris Abdul", class: "8A", gender: "L" },
                { nis: "1006", name: "Gita Lestari", class: "9A", gender: "P" }
            ],
            attendance: [
                // { id, date, nis, studentName, class, mapel, teacherName, status: 'H'|'I'|'S'|'A', time }
                { id: '1', date: new Date().toISOString().split('T')[0], nis: "1001", studentName: "Ahmad Saepullah", class: "7A", mapel: "Matematika", teacherName: "Dadan Ramdani, S.Pd.", status: "H", time: "07:15" },
                { id: '2', date: new Date().toISOString().split('T')[0], nis: "1002", studentName: "Anisa Fitriani", class: "7A", mapel: "Matematika", teacherName: "Dadan Ramdani, S.Pd.", status: "H", time: "07:18" }
            ]
        };

        // Load saved state from LocalStorage if exists
        function loadSavedData() {
            const saved = localStorage.getItem("mts_buninagara_app_data");
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData = { ...appData, ...parsed };
                } catch(e) {
                    console.error("Failed to parse saved data", e);
                }
            }
        }

        function saveData() {
            localStorage.setItem("mts_buninagara_app_data", JSON.stringify(appData));
        }

        // Toast Helper
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info';
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-xs sm:text-sm font-medium transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        let loginRole = 'admin';

        function switchLoginTab(role) {
            loginRole = role;
            const btnAdmin = document.getElementById('tabBtnAdmin');
            const btnGuru = document.getElementById('tabBtnGuru');
            const hint = document.getElementById('loginHint');

            if (role === 'admin') {
                btnAdmin.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all bg-emerald-600 text-white shadow-sm";
                btnGuru.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all";
                hint.innerHTML = `<span class="font-bold">Info Demo Admin:</span><br>User: <code class="bg-white px-1.5 py-0.5 rounded border border-emerald-300 font-mono">MTsbuninagara</code><br>Pass: <code class="bg-white px-1.5 py-0.5 rounded border border-emerald-300 font-mono">Dadan.123</code>`;
            } else {
                btnGuru.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg transition-all bg-emerald-600 text-white shadow-sm";
                btnAdmin.className = "flex-1 py-2 text-xs sm:text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition-all";
                hint.innerHTML = `<span class="font-bold">Info Guru Mapel:</span><br>Gunakan akun yang di-generate oleh Admin di menu <b>Manajemen Akun</b>. (E.g. dadan / 123)`;
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();

            if (loginRole === 'admin') {
                if (u === 'MTsbuninagara' && p === 'Dadan.123') {
                    currentUser = {
                        role: 'admin',
                        username: u,
                        name: 'Administrator MTs',
                        nip: 'ADMIN-BUNINAGARA'
                    };
                    initAppSession();
                    showToast('Selamat datang, Admin MTs Buninagara!');
                } else {
                    showToast('Username atau password Admin salah!', 'error');
                }
            } else {
                const foundAcc = appData.accounts.find(a => a.username.toLowerCase() === u.toLowerCase() && a.password === p);
                if (foundAcc) {
                    const teacher = appData.teachers.find(t => t.id === foundAcc.teacherId);
                    currentUser = {
                        role: 'guru',
                        username: foundAcc.username,
                        name: foundAcc.teacherName,
                        mapel: foundAcc.mapel,
                        teacherId: foundAcc.teacherId,
                        nip: teacher ? teacher.nip : '-'
                    };
                    initAppSession();
                    showToast(`Selamat datang, Bpk/Ibu ${currentUser.name}!`);
                } else {
                    showToast('Akun Guru tidak ditemukan atau password salah!', 'error');
                }
            }
        }

        function handleLogout() {
            currentUser = null;
            if (html5QrcodeScanner) {
                try { html5QrcodeScanner.stop(); } catch(e){}
            }
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            showToast('Berhasil keluar dari akun.', 'info');
        }

        function initAppSession() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');

            // Update UI elements
            document.getElementById('userDisplayName').innerText = currentUser.name;
            document.getElementById('userDisplayRole').innerText = currentUser.role === 'admin' ? 'SUPER ADMIN' : `GURU: ${currentUser.mapel}`;
            document.getElementById('userAvatar').innerText = currentUser.name.charAt(0);
            document.getElementById('mobileHeaderUser').innerText = currentUser.name;

            // Apply custom logos
            if (appData.logo) {
                document.getElementById('loginLogo').src = appData.logo;
                document.getElementById('appLogoSidebar').src = appData.logo;
                document.getElementById('appLogoHeader').src = appData.logo;
            }

            renderNavLinks();
            navigateTo(currentUser.role === 'admin' ? 'dashboard' : 'scan');
        }

        function renderNavLinks() {
            const desktopNav = document.getElementById('desktopNavLinks');
            const mobileNav = document.getElementById('mobileBottomNav');

            let navItems = [];

            if (currentUser.role === 'admin') {
                navItems = [
                    { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                    { id: 'guru', label: 'Data Guru', icon: 'fa-chalkboard-user' },
                    { id: 'akun', label: 'Manajemen Akun', icon: 'fa-users-gear' },
                    { id: 'siswa', label: 'Data Siswa', icon: 'fa-user-graduate' },
                    { id: 'scan', label: 'Presensi Scan', icon: 'fa-qrcode' },
                    { id: 'rekap', label: 'Rekap Absensi', icon: 'fa-file-invoice' },
                    { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-sliders' }
                ];
            } else { // Guru
                navItems = [
                    { id: 'scan', label: 'Absensi Scan', icon: 'fa-qrcode' },
                    { id: 'rekap', label: 'Rekap Absensi', icon: 'fa-file-invoice' },
                    { id: 'siswa', label: 'Data Siswa', icon: 'fa-user-graduate' },
                    { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-sliders' }
                ];
            }

            // Desktop Nav HTML
            desktopNav.innerHTML = navItems.map(item => `
                <button onclick="navigateTo('${item.id}')" id="deskNav-${item.id}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${currentView === item.id ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                    <i class="fa-solid ${item.icon} text-sm w-5 text-center"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');

            // Mobile Nav HTML (Show max 5)
            mobileNav.innerHTML = navItems.slice(0, 5).map(item => `
                <button onclick="navigateTo('${item.id}')" id="mobNav-${item.id}" class="flex flex-col items-center py-1 px-2 rounded-lg transition-all ${currentView === item.id ? 'text-emerald-600 font-bold' : 'text-slate-400 font-medium'}">
                    <i class="fa-solid ${item.icon} text-lg"></i>
                    <span class="text-[10px] mt-0.5">${item.label}</span>
                </button>
            `).join('');
        }

        function navigateTo(view) {
            currentView = view;
            renderNavLinks();

            // Stop camera if navigating away from scan
            if (view !== 'scan' && html5QrcodeScanner) {
                try { html5QrcodeScanner.stop(); } catch(e){}
            }

            const main = document.getElementById('mainContentView');
            switch (view) {
                case 'dashboard':
                    renderDashboardView(main);
                    break;
                case 'guru':
                    renderGuruView(main);
                    break;
                case 'akun':
                    renderAkunView(main);
                    break;
                case 'siswa':
                    renderSiswaView(main);
                    break;
                case 'scan':
                    renderScanView(main);
                    break;
                case 'rekap':
                    renderRekapView(main);
                    break;
                case 'pengaturan':
                    renderPengaturanView(main);
                    break;
                default:
                    main.innerHTML = `<p>View tidak ditemukan</p>`;
            }
        }

        function renderDashboardView(container) {
            const today = new Date().toISOString().split('T')[0];
            const todayLogs = appData.attendance.filter(a => a.date === today);

            const hadirCount = todayLogs.filter(a => a.status === 'H').length;
            const izinCount = todayLogs.filter(a => a.status === 'I').length;
            const sakitCount = todayLogs.filter(a => a.status === 'S').length;
            const alpaCount = todayLogs.filter(a => a.status === 'A').length;

            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Welcome Banner -->
                    <div class="bg-gradient-to-r from-emerald-700 to-teal-800 text-white rounded-2xl p-6 shadow-lg flex flex-col md:flex-row items-center justify-between gap-4">
                        <div class="space-y-1 text-center md:text-left">
                            <span class="bg-emerald-500/30 text-emerald-200 text-xs px-2.5 py-1 rounded-full font-semibold border border-emerald-400/30">
                                MTs BUNINAGARA ONLINE
                            </span>
                            <h2 class="text-xl sm:text-2xl font-bold mt-2">Selamat Datang di Sistem Presensi</h2>
                            <p class="text-xs sm:text-sm text-emerald-100/80">Kelola data presensi harian siswa dengan pemindaian Barcode/QR cepat.</p>
                        </div>
                        <button onclick="navigateTo('scan')" class="px-5 py-3 bg-white text-emerald-800 hover:bg-emerald-50 font-bold rounded-xl text-xs sm:text-sm shadow-md transition-all flex items-center gap-2 shrink-0">
                            <i class="fa-solid fa-qrcode text-base"></i>
                            <span>Buka Scanner Presensi</span>
                        </button>
                    </div>

                    <!-- Statistics Cards -->
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl shrink-0">
                                <i class="fa-solid fa-user-graduate"></i>
                            </div>
                            <div>
                                <p class="text-xs text-slate-500 font-medium">Total Siswa</p>
                                <h3 class="text-xl font-bold text-slate-800">${appData.students.length}</h3>
                            </div>
                        </div>

                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">

            // Check if account for this teacher exists

                existing.username = username;
                existing.password = password;
                showToast(`Akun untuk ${teacher.name} diperbarui!`);

        function saveStudent(e, oldNis) {
            e.preventDefault();
            const nis = document.getElementById('modalSiswaNis').value.trim();
            const name = document.getElementById('modalSiswaName').value.trim();
            const cls = document.getElementById('modalSiswaClass').value;
            const gender = document.getElementById('modalSiswaGender').value;

            if (oldNis) {
                const idx = appData.students.findIndex(s => s.nis === oldNis);
                if (idx !== -1) {
                    appData.students[idx] = { nis, name, class: cls, gender };
                    showToast('Data siswa berhasil diperbarui');
                }
            } else {
                if (appData.students.some(s => s.nis === nis)) {
                    showToast('NIS sudah terdaftar!', 'error');
                    return;
                }
                appData.students.push({ nis, name, class: cls, gender });
                showToast('Siswa baru berhasil ditambahkan');
            }
            saveData();
            closeModal();
            renderSiswaView(document.getElementById('mainContentView'));
        }

        function handleExcelUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (json.length === 0) {
                        showToast('File Excel kosong!', 'error');
                        return;
                    }

                    let addedCount = 0;
                    json.forEach(row => {
                        const nis = String(row.NIS || row.nis || '').trim();
                        const name = String(row.Nama || row.NAMA || row.nama || '').trim();
                        const cls = String(row.Kelas || row.KELAS || row.kelas || '7A').trim();
                        const gender = String(row.Gender || row.GENDER || row.gender || 'L').trim().toUpperCase().charAt(0);

                        if (nis && name) {
                            if (!appData.students.some(s => s.nis === nis)) {
                                appData.students.push({ nis, name, class: cls, gender });
                                addedCount++;
                            }
                        }
                    });

                    saveData();
                    showToast(`Berhasil mengimpor ${addedCount} siswa dari Excel!`);
                    closeModal();
                    renderSiswaView(document.getElementById('mainContentView'));
                } catch(err) {
                    console.error(err);
                    showToast('Gagal memproses file Excel!', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function playBeepSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e){}
        }

        function startCameraScanner() {
            if (html5QrcodeScanner) {
                try { html5QrcodeScanner.stop(); } catch(e){}
            }

            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 150 } };

            html5QrcodeScanner.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.warn("Camera access error", err);
                document.getElementById('reader').innerHTML = `
                    <div class="p-6 text-center space-y-2">
                        <i class="fa-solid fa-camera-retro text-2xl text-slate-400"></i>
                        <p class="text-xs text-slate-300">Kamera tidak aktif atau tidak diizinkan. Gunakan input NIS manual di bawah.</p>
                    </div>
                `;
            });
        }

        function processStudentAttendance(nis) {
            const student = appData.students.find(s => s.nis === nis);
            if (!student) {
                showToast(`Siswa dengan NIS ${nis} tidak ditemukan!`, 'error');
                return;
            }

            const mapel = document.getElementById('scanMapelInput').value || 'Umum';
            const teacherName = document.getElementById('scanTeacherInput').value || 'Guru';
            const today = new Date().toISOString().split('T')[0];
            const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            // Check if already scanned today for this subject
            const existingLog = appData.attendance.find(a => a.date === today && a.nis === nis && a.mapel === mapel);
            if (existingLog) {
                showToast(`${student.name} sudah melakukan presensi hari ini untuk mapel ${mapel}!`, 'info');
                return;
            }

            // Record attendance
            const newLog = {
                id: String(Date.now()),
                date: today,
                nis: student.nis,
                studentName: student.name,
                class: student.class,
                mapel: mapel,
                teacherName: teacherName,
                status: 'H',
                time: nowTime
            };

            appData.attendance.unshift(newLog);
            saveData();
            playBeepSound();

            // Display Feedback Card
            const card = document.getElementById('scanResultCard');
            document.getElementById('scanResultName').innerText = student.name;
            document.getElementById('scanResultDetails').innerText = `NIS: ${student.nis} | Kelas: ${student.class} | Mapel: ${mapel} | Jam: ${nowTime}`;
            card.classList.remove('hidden');

            showToast(`BERHASIL: Presensi ${student.name} dicatat!`);
        }

        function getFilteredAttendance() {
            const mapel = document.getElementById('rekapFilterMapel')?.value || '';
            const kelas = document.getElementById('rekapFilterKelas')?.value || '';
            const bulanIdx = parseInt(document.getElementById('rekapFilterBulan')?.value || new Date().getMonth());

            return appData.attendance.filter(log => {
                const logDate = new Date(log.date);
                const matchMapel = !mapel || log.mapel === mapel;
                const matchKelas = !kelas || log.class === kelas;
                const matchBulan = logDate.getMonth() === bulanIdx;
                return matchMapel && matchKelas && matchBulan;
            });
        }

        function applyRekapFilter() {
            const tbody = document.getElementById('rekapTbody');
            if (!tbody) return;

            const filtered = getFilteredAttendance();

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="p-6 text-center text-slate-400 italic">Tidak ada data presensi sesuai filter yang dipilih.</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(log => `
                <tr class="hover:bg-slate-50/80 transition-all">
                    <td class="p-3.5 font-mono text-slate-600 text-[11px]">${log.date} ${log.time ? `(${log.time})` : ''}</td>
                    <td class="p-3.5 font-mono font-medium text-slate-600">${log.nis}</td>

                    <td class="p-3.5 text-center">

                            ${getStatusLabel(log.status)}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'H': return 'bg-emerald-100 text-emerald-800 border border-emerald-300';
                case 'I': return 'bg-blue-100 text-blue-800 border border-blue-300';
                case 'S': return 'bg-amber-100 text-amber-800 border border-amber-300';
                case 'A': return 'bg-rose-100 text-rose-800 border border-rose-300';
                default: return 'bg-slate-100 text-slate-700';
            }
        }

        function getStatusLabel(status) {
            switch(status) {
                case 'H': return 'Hadir';
                case 'I': return 'Izin';
                case 'S': return 'Sakit';
                case 'A': return 'Alpa';
                default: return status;
            }
        }

                "NIS": item.nis,
                "Nama Siswa": item.studentName,
                "Kelas": item.class,
                "Mata Pelajaran": item.mapel,
                "Guru Pengajar": item.teacherName,
                "Status Kehadiran": getStatusLabel(item.status)
            }));

            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Rekap Presensi");
            XLSX.writeFile(wb, `Rekap_Presensi_MTs_Buninagara_${Date.now()}.xlsx`);
            showToast('File Excel berhasil diunduh!');
        }

        function exportRekapPDF() {
            const data = getFilteredAttendance();
            if (data.length === 0) {
                showToast('Tidak ada data untuk diekspor ke PDF!', 'error');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

            const mapel = document.getElementById('rekapFilterMapel')?.value || 'Semua Mata Pelajaran';
            const kelas = document.getElementById('rekapFilterKelas')?.value || 'Semua Kelas';
            const teacherName = currentUser ? currentUser.name : 'Guru Mata Pelajaran';

            // Header Kop Surat
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text("MADRASAH TSANAWIYAH (MTs) BUNINAGARA", 105, 15, { align: "center" });
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text("REKAPITULASI PRESENSI KEHADIRAN SISWA", 105, 21, { align: "center" });
            doc.text(`Mata Pelajaran: ${mapel} | Kelas: ${kelas}`, 105, 26, { align: "center" });
            
            doc.setLineWidth(0.5);
            doc.line(15, 29, 195, 29);

            // Table Body
            const tableRows = data.map((item, idx) => [
                idx + 1,
                item.date,
                item.nis,
                item.studentName,
                item.class,
                item.mapel,
                getStatusLabel(item.status)
            ]);

            doc.autoTable({
                startY: 33,
                head: [['No', 'Tanggal', 'NIS', 'Nama Siswa', 'Kelas', 'Mapel', 'Status']],
                body: tableRows,
                styles: { fontSize: 8, cellPadding: 2 },
                headStyles: { fillColor: [22, 163, 74], textColor: 255 },
                theme: 'grid'
            });

            const finalY = doc.lastAutoTable.finalY + 15;

            // Signature Section
            const todayStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            doc.setFontSize(9);
            doc.text(`Buninagara, ${todayStr}`, 140, finalY);
            doc.text("Guru Mata Pelajaran,", 140, finalY + 5);
            
            doc.text("( ___________________________ )", 140, finalY + 28);
            doc.text(`Nama: ${teacherName}`, 140, finalY + 33);

            doc.save(`Rekap_Presensi_MTs_Buninagara_${Date.now()}.pdf`);
            showToast('Dokumen PDF rekap presensi berhasil diunduh!');
        }

        function renderPengaturanView(container) {
            container.innerHTML = `
                <div class="space-y-6 max-w-2xl mx-auto">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">Pengaturan Aplikasi & Akun</h2>
                        <p class="text-xs text-slate-500">Atur logo madrasah dan kredensial kata sandi.</p>
                    </div>

                    <!-- Logo Settings Card -->
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-4">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-image text-emerald-600"></i>
                            Ganti Logo Madrasah (JPG / PNG)
                        </h3>

                        <div class="flex items-center gap-6">
                            <div class="w-20 h-20 rounded-2xl bg-slate-50 border-2 border-slate-200 p-2 flex items-center justify-center shrink-0 overflow-hidden">
                                <img id="previewLogoSetting" src="${appData.logo}" alt="Logo preview" class="w-full h-full object-contain">
                            </div>

                            <div class="space-y-2 flex-1">
                                <p class="text-xs text-slate-600">Unggah berkas gambar logo baru untuk mengganti logo di seluruh sistem dan berkas rekap PDF.</p>
                                <input type="file" id="logoFileInput" accept="image/png, image/jpeg" class="hidden" onchange="handleLogoUpload(event)">
                                <button onclick="document.getElementById('logoFileInput').click()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-xs shadow-sm flex items-center gap-2">
                                    <i class="fa-solid fa-upload"></i> Unggah Logo Baru
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Password Settings Card -->
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-4">
                        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-key text-emerald-600"></i>
                            Ganti Kata Sandi Akun (${currentUser ? currentUser.name : ''})
                        </h3>

                        <form onsubmit="handleChangePassword(event)" class="space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Password Baru</label>
                                <input type="password" id="newPasswordInput" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-emerald-500" placeholder="Masukkan password baru">
                            </div>

                            <div class="pt-2 flex justify-end">
                                <button type="submit" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl text-xs shadow-md">
                                    Simpan Password Baru
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleLogoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type !== 'image/png' && file.type !== 'image/jpeg') {
                showToast('Hanya format JPG atau PNG yang diperbolehkan!', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (evt) {
                const base64 = evt.target.result;
                appData.logo = base64;
                saveData();

                document.getElementById('previewLogoSetting').src = base64;
                document.getElementById('loginLogo').src = base64;
                document.getElementById('appLogoSidebar').src = base64;
                document.getElementById('appLogoHeader').src = base64;

                showToast('Logo madrasah berhasil diperbarui!');
            };
            reader.readAsDataURL(file);
        }

        function handleChangePassword(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPasswordInput').value.trim();

            if (currentUser.role === 'guru') {
                const acc = appData.accounts.find(a => a.username === currentUser.username);
                if (acc) {
                    acc.password = newPass;
                    saveData();
                    showToast('Password guru berhasil diperbarui!');
                }
            } else {
                showToast('Password admin diperbarui untuk sesi ini');
            }
            document.getElementById('newPasswordInput').value = '';
        }

        function openModal() {
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        // Initialize state on page load
        window.onload = function() {
            loadSavedData();
        };
    </script>
</body>
</html>
